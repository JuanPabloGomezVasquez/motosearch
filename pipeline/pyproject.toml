[project]
name = "motosearch"
version = "0.0.1"
description = "Pipeline de datos de motosearch: captura, normalización y validación de fichas técnicas"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
js = ["playwright>=1.45"]      # solo para fuentes que lo necesiten (render con JS)
pdf = ["pdfplumber>=0.11"]     # fichas en PDF
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
motosearch = "motosearch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motosearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
