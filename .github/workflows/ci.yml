name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run ruff check src tests
      - run: uv run pytest -q

  esquema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: |
          psql -v ON_ERROR_STOP=1 -f db/migrations/0001_esquema_inicial.sql
          psql -v ON_ERROR_STOP=1 -f db/seed/0001_catalogos.sql
          psql -v ON_ERROR_STOP=1 -f db/tests/smoke.sql
